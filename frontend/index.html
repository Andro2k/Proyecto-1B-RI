<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recuperación de Información · FiQA-2018</title>
  <meta name="description" content="Comparador de modelos de recuperación de información (Jaccard, TF-IDF, BM25 y embeddings) sobre FiQA-2018.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script>try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body data-state="home">
  <header class="topbar">
    <div class="container bar">
      <a id="brand" class="brand" href="./" aria-label="Ir al inicio">
        <span class="logo" aria-hidden="true"></span>
        <span class="brand-text"><strong>Recuperación de Información</strong><span>FiQA-2018</span></span>
      </a>
      <div id="bar-slot" class="bar-slot"></div>
      <nav class="nav">
        <button id="nav-analysis" class="btn ghost" type="button"></button>
        <button id="theme" class="btn ghost icon" type="button" aria-label="Cambiar entre tema claro y oscuro"></button>
      </nav>
    </div>
  </header>

  <main class="container">
    <div id="alerts" aria-live="polite"></div>

    <section id="hero" class="hero">
      <span class="logo big" aria-hidden="true"></span>
      <h1>Recuperación de Información</h1>
      <p class="muted">Compara Jaccard, TF-IDF, BM25 y embeddings sobre FiQA-2018</p>
      <div id="hero-slot" class="hero-slot">
        <div id="searchwrap" class="searchwrap">
          <form id="form" autocomplete="off">
            <div class="search-group">
              <label for="q" class="sr-only">Consulta</label>
              <input id="q" type="search" maxlength="500" required placeholder="Pregunta algo en inglés, p. ej. where should I park my emergency fund?">
              <button id="go" class="btn primary" type="submit"></button>
            </div>
            <button type="button" id="adv-toggle" class="adv-toggle" aria-expanded="false" aria-controls="adv" aria-label="Ajustes avanzados"></button>
          </form>
          <div id="adv" class="adv card" hidden>
            <div class="adv-fields">
              <div class="field"><label class="label" for="model">Modelo</label><select id="model" class="input select"></select></div>
              <div class="field"><label class="label" for="k">Resultados (top-n)</label><select id="k" class="input select"><option>5</option><option selected>10</option><option>20</option></select></div>
            </div>
            <div class="adv-samples"><span class="label">Consultas de ejemplo</span><div id="samples" class="samples"></div></div>
          </div>
        </div>
      </div>
    </section>

    <section id="view-results" hidden></section>
    <section id="view-metrics" hidden></section>
  </main>

  <dialog id="doc" aria-labelledby="doc-title">
    <div class="dialog-head"><h3 id="doc-title"></h3><button id="doc-close" class="btn ghost icon" type="button" aria-label="Cerrar"></button></div>
    <p id="doc-id" class="muted small"></p>
    <div id="doc-text" class="doc-text"></div>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
